spring:
  profiles:
    active: dev
  application:
    name: store-ecommerce-backend

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:ali_store_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  shipping:
    currency: ${STORE_CURRENCY:SAR}
    standard-cost: ${SHIPPING_STANDARD_COST:15}
    express-cost: ${SHIPPING_EXPRESS_COST:35}
    free-threshold: ${SHIPPING_FREE_THRESHOLD:250}
    standard-min-days: ${SHIPPING_STANDARD_MIN_DAYS:7}
    standard-max-days: ${SHIPPING_STANDARD_MAX_DAYS:15}
    express-min-days: ${SHIPPING_EXPRESS_MIN_DAYS:2}
    express-max-days: ${SHIPPING_EXPRESS_MAX_DAYS:5}
  supplier-sync:
    enabled: ${SUPPLIER_SYNC_ENABLED:false}
    poll-ms: ${SUPPLIER_SYNC_POLL_MS:60000}
    inventory-path: ${SUPPLIER_INVENTORY_PATH:/v1/inventory}
    api-token: ${SUPPLIER_API_TOKEN:}
  fulfillment:
    enabled: ${FULFILLMENT_ENABLED:false}
    api-path: ${SUPPLIER_FULFILLMENT_API_PATH:/v1/orders}
    api-token: ${SUPPLIER_API_TOKEN:}
    webhook-token: ${SUPPLIER_WEBHOOK_TOKEN:}
    poll-ms: ${FULFILLMENT_POLL_MS:10000}