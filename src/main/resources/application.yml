spring:
  profiles:
    active: dev
  application:
    name: store-ecommerce-backend

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the sole schema authority. Hibernate must never auto-mutate the schema.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only health/info - never env/beans/mappings/configprops, which can
        # leak configuration and internal wiring details.
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
