spring:
  profiles:
    default: dev
  application:
    name: store-ecommerce-backend

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    max-input-chars: ${AI_MAX_INPUT_CHARS:1200}
    max-context-products: ${AI_MAX_CONTEXT_PRODUCTS:8}
  visual-search:
    max-file-bytes: ${VISUAL_SEARCH_MAX_FILE_BYTES:10485760}
    max-candidates: ${VISUAL_SEARCH_MAX_CANDIDATES:200}
    max-results: ${VISUAL_SEARCH_MAX_RESULTS:6}
    remote-timeout-ms: ${VISUAL_SEARCH_REMOTE_TIMEOUT_MS:2500}
    remote-max-bytes: ${VISUAL_SEARCH_REMOTE_MAX_BYTES:10485760}
  mail:
    from: ${MAIL_FROM:}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:ali_store_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:}
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    frontend-success-redirect: ${FRONTEND_AUTH_SUCCESS_REDIRECT:http://localhost:3000/buyer/profile}
    frontend-failure-redirect: ${FRONTEND_AUTH_FAILURE_REDIRECT:http://localhost:3000/login?error=google}
    email-verification-enabled: ${AUTH_EMAIL_VERIFICATION_ENABLED:true}
    login-email-otp-enabled: ${AUTH_LOGIN_EMAIL_OTP_ENABLED:true}
    email-code-expiration-seconds: ${AUTH_EMAIL_CODE_EXPIRATION_SECONDS:600}
    email-code-max-attempts: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:5}
    email-code-resend-cooldown-seconds: ${AUTH_EMAIL_CODE_RESEND_COOLDOWN_SECONDS:60}
  fulfillment:
    enabled: ${FULFILLMENT_ENABLED:false}
    api-path: ${SUPPLIER_FULFILLMENT_API_PATH:/v1/orders}
    api-token: ${SUPPLIER_API_TOKEN:}
    webhook-token: ${SUPPLIER_WEBHOOK_TOKEN:}
    webhook-max-skew-seconds: ${SUPPLIER_WEBHOOK_MAX_SKEW_SECONDS:300}
    poll-ms: ${FULFILLMENT_POLL_MS:10000}
  inventory-sync:
    enabled: ${INVENTORY_SYNC_ENABLED:false}
    api-path: ${SUPPLIER_INVENTORY_API_PATH:/v1/inventory}
    api-token: ${SUPPLIER_API_TOKEN:}
    poll-ms: ${INVENTORY_SYNC_POLL_MS:300000}
    stale-after-ms: ${INVENTORY_STALE_AFTER_MS:1800000}

# Production supplier webhook secrets are resolved per supplier code via SUPPLIER_WEBHOOK_TOKEN_<NORMALIZED_CODE>.
