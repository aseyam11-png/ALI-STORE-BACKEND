spring:
  profiles:
    active: dev
  application:
    name: store-ecommerce-backend

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:ali-store-backend}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:ali_store_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  inventory-sync:
    enabled: ${INVENTORY_SYNC_ENABLED:false}
    poll-ms: ${INVENTORY_SYNC_POLL_MS:300000}
    api-path: ${SUPPLIER_INVENTORY_API_PATH:/v1/inventory}
    stale-after-ms: ${INVENTORY_STALE_AFTER_MS:1800000}
  fulfillment:
    enabled: ${FULFILLMENT_ENABLED:false}
    api-path: ${SUPPLIER_FULFILLMENT_API_PATH:/v1/orders}
    api-token: ${SUPPLIER_API_TOKEN:}
    webhook-token: ${SUPPLIER_WEBHOOK_TOKEN:}
    poll-ms: ${FULFILLMENT_POLL_MS:10000}
    webhook-max-skew-seconds: ${SUPPLIER_WEBHOOK_MAX_SKEW_SECONDS:300}
