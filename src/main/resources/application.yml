spring:
  profiles:
    active: dev
  application:
    name: store-ecommerce-backend

  main:
    allow-bean-definition-overriding: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:ali_store_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  shipping:
    standard-rate: ${SHIPPING_STANDARD_RATE:0}
    express-rate: ${SHIPPING_EXPRESS_RATE:8}
    free-threshold: ${SHIPPING_FREE_THRESHOLD:0}
    standard-estimate: ${SHIPPING_STANDARD_ESTIMATE:7-15 business days}
    express-estimate: ${SHIPPING_EXPRESS_ESTIMATE:3-7 business days}
  fulfillment:
    enabled: ${FULFILLMENT_ENABLED:false}
    api-path: ${SUPPLIER_FULFILLMENT_API_PATH:/v1/orders}
    api-token: ${SUPPLIER_API_TOKEN:}
    webhook-token: ${SUPPLIER_WEBHOOK_TOKEN:}
    poll-ms: ${FULFILLMENT_POLL_MS:10000}