# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# All production secrets/origins are explicit environment variables.

server:
  # The app is expected to sit behind a TLS-terminating reverse proxy/load balancer.
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    frontend-success-redirect: ${FRONTEND_AUTH_SUCCESS_REDIRECT}
    frontend-failure-redirect: ${FRONTEND_AUTH_FAILURE_REDIRECT}

# A real PaymentProvider bean MUST be supplied for this profile.
# MockPaymentProvider is excluded from "prod", so the app fails to start
# instead of silently accepting fake payments.
