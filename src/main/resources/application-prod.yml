# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

app:
  fulfillment:
    enabled: ${FULFILLMENT_ENABLED:true}
  inventory-sync:
    enabled: ${INVENTORY_SYNC_ENABLED:true}

# Production must provide a real PaymentProvider bean.
# MockPaymentProvider is excluded from the prod profile and therefore fake
# payments can never be accepted silently.

  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}
