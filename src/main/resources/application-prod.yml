# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# No default credentials anywhere in this file - every secret-bearing value
# must come from the environment, and startup fails fast if one is missing.
server:
  # Assumes production sits behind a TLS-terminating reverse proxy/load balancer
  # (standard for a Spring Boot app - see application.yml, there is no server.ssl.*
  # config here). Without this, request.isSecure() always reads false behind the
  # proxy, so Spring Security's default HSTS header writer would never fire even
  # though the client is actually on HTTPS.
  #
  # "native" (not "framework") deliberately: framework's ForwardedHeaderFilter trusts
  # X-Forwarded-* unconditionally from any peer, with no allowlist - exactly what we
  # do NOT want (see ClientIpResolver's javadoc for the same concern applied to rate
  # limiting). "native" engages the embedded Tomcat connector's RemoteIpValve, which
  # only trusts X-Forwarded-Proto/-For when the IMMEDIATE TCP peer matches its
  # internal-proxies pattern. Unset here, that pattern falls back to Tomcat's own
  # built-in default (RFC1918 private ranges + loopback only) - safe for the common
  # case of a load balancer/ingress on a private subnet in front of this app. If this
  # is ever deployed with a proxy NOT on a private address, override
  # server.tomcat.remoteip.internal-proxies explicitly to match the real deployment,
  # rather than relying on this default.
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

# Production browser-cookie policy is deployment-specific. Require the operator to
# choose SameSite for the actual frontend/API site relationship and enable Secure cookies.
app:
  # Production must never inherit the localhost CORS default from application.yml.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    # Require deployed frontend URLs; never inherit localhost defaults in production.
    frontend-success-redirect: ${FRONTEND_AUTH_SUCCESS_REDIRECT}
    frontend-failure-redirect: ${FRONTEND_AUTH_FAILURE_REDIRECT}
    cookie-secure: ${AUTH_COOKIE_SECURE}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE}
    # Both must be configured in production; administrator login fails closed otherwise.
    admin-gate-password-hash: ${ADMIN_GATE_PASSWORD_HASH}
    turnstile-secret-key: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
    turnstile-expected-hostname: ${TURNSTILE_EXPECTED_HOSTNAME:}

# A real PaymentProvider bean MUST be supplied for this profile - MockPaymentProvider
# is annotated @Profile("!prod") and will not be available here, so the application
# fails to start rather than silently accepting fake payments (see payment.provider package).
