spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

# Local development: password login should be usable without external SMTP.
# Verification and login OTP remain explicitly configurable through the environment.
app:
  auth:
    email-verification-enabled: ${AUTH_EMAIL_VERIFICATION_ENABLED:false}
    login-email-otp-enabled: ${AUTH_LOGIN_EMAIL_OTP_ENABLED:false}
