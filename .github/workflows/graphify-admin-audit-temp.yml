name: Temporary Graphify Admin Auth Audit

on:
  push:
    branches:
      - feature/admin-auth-otp-gate-scoped-20261111

permissions:
  contents: read

concurrency:
  group: graphify-backend-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
          graphify --version

      - name: Build backend architecture graph
        run: graphify extract . --code-only

      - name: Trace administrator OTP security path
        shell: bash
        run: |
          set -euo pipefail
          graphify query "Trace admin login controller endpoints, first-factor authentication, server-side admin password and Turnstile gate, ADMIN_LOGIN OTP challenge creation and verification, JWT gate authority, rate limiting, CSRF and security configuration, and V22 migration. Identify tests and direct module dependencies."
          graphify path "AuthController" "AdminLoginGateService" --undirected
          graphify path "AdminLoginGateService" "EmailOtpService" --undirected
          graphify path "AuthService" "JwtAuthenticationFilter" --undirected
          graphify explain "AdminLoginGateService"
          graphify explain "AuthService"
          graphify explain "JwtAuthenticationFilter"

      - name: Upload temporary graph artifact
        uses: actions/upload-artifact@v6
        with:
          name: alistore-backend-admin-graphify-audit
          path: graphify-out/
          if-no-files-found: ignore
