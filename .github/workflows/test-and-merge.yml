name: ALI STORE - Test and Merge Unified Fixes

on:
  push:
    branches:
      - integration/ali-store-backend-unified-fixes-20261026
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ali-store-test-and-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: dGVzdC1wcm9kdWN0aW9uLXNpZ25pbmcta2V5LWZvci1jaS1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==
  JWT_EXPIRATION: 3600000
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  AUTH_COOKIE_SECURE: false

jobs:
  quality:
    name: Workflow lint, whitespace and compile checks
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'integration/ali-store-backend-unified-fixes-20261026' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and package without running tests
        run: bash ./mvnw -B -ntp -DskipTests package

  unit-integration:
    name: Maven unit and integration tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'integration/ali-store-backend-unified-fixes-20261026' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and H2-backed integration tests
        run: bash ./mvnw -B -ntp test

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-unit-integration-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  postgres-concurrency:
    name: Real PostgreSQL concurrency tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'integration/ali-store-backend-unified-fixes-20261026' &&
       github.event.pull_request.base.ref == 'main')
    needs: [quality, unit-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run real PostgreSQL concurrency suite
        run: bash ./mvnw -B -ntp -Dtest=PostgresConcurrencyIT test

      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  auto-merge:
    name: Auto-merge only after all gates pass
    needs: [quality, unit-integration, postgres-concurrency]
    if: >-
      success() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'integration/ali-store-backend-unified-fixes-20261026' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the exact tested head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$EXPECTED_HEAD_SHA"
