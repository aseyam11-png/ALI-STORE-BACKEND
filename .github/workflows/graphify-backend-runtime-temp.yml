name: Temporary Graphify Backend Runtime Refresh

on:
  push:
    branches:
      - feature/admin-auth-otp-gate-scoped-20261111

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Rebuild architecture graph from changed backend sources
        run: graphify extract . --code-only --force
      - name: Verify production auth and payment-provider dependencies
        run: |
          graphify query "Trace AdminLoginGateService, AuthController admin login, ADMIN_LOGIN OTP challenge, JWT admin gate claim and filter, SecurityConfig public routes, and the new production UnavailablePaymentProvider bean and test."
          graphify explain "AdminLoginGateService"
          graphify explain "UnavailablePaymentProvider"
          graphify path "AuthService" "JwtAuthenticationFilter" --undirected
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-backend-auth-runtime-final
          path: graphify-out/
          if-no-files-found: ignore
