name: ALI STORE Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: dGVzdC1wcm9kdWN0aW9uLXNpZ25pbmcta2V5LWZvci1jaS1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==
      JWT_EXPIRATION: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_SECURE: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: bash ./mvnw -B test

      - name: Run PostgreSQL integration test
        run: bash ./mvnw -B -Dtest=PostgresConcurrencyIT test
