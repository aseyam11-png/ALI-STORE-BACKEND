name: ALI STORE Backend CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: dGVzdC1wcm9kdWN0aW9uLXNpZ25pbmcua2V5LmZvci5jaS5vbmx5
      JWT_EXPIRATION: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: bash ./mvnw -B test
